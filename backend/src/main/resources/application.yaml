server:
  port: 8080

spring:
  datasource:
    url: ${}
    username: ${}
    password: ${}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          format-sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${}
    password: ${}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true